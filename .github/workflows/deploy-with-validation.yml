name: 🚀 Production Deploy with Validation & Auto-Versioning

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'docs/**'

env:
  DEPLOYMENT_STATUS_FILE: '.deployment-status'

jobs:
  # STAGE 1: VALIDATE ALL FILES
  validate:
    name: 🔍 Validate Files
    runs-on: ubuntu-latest
    outputs:
      validation_status: ${{ steps.validate.outputs.status }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Validation Script
        id: validate
        run: |
          if [ ! -d "scripts" ]; then
            mkdir -p scripts
          fi
          
          # Run validation
          node scripts/validate-deployment.js
          VALIDATION_RESULT=$?
          
          if [ $VALIDATION_RESULT -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ All validations passed"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ Validation failed"
            exit 1
          fi

      - name: Check for Syntax Errors
        run: |
          echo "Checking HTML files..."
          for file in *.html; do
            if grep -q "<<\|>>" "$file"; then
              echo "❌ Syntax error in $file"
              exit 1
            fi
          done
          echo "✅ No syntax errors found"

  # STAGE 2: BUILD & TEST
  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.validation_status == 'success'
    outputs:
      build_status: ${{ steps.build.outputs.status }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Verify Critical Files
        id: build
        run: |
          echo "🔧 Building project..."
          
          # Check all critical files exist
          REQUIRED_FILES=("index.html" "styles.css" "main.js" "sw.js" "manifest.json")
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Critical file missing: $file"
              exit 1
            fi
          done
          
          echo "✅ All required files present"
          
          # Verify file sizes
          for file in "${REQUIRED_FILES[@]}"; do
            SIZE=$(wc -c < "$file")
            if [ "$SIZE" -eq 0 ]; then
              echo "❌ File is empty: $file"
              exit 1
            fi
            echo "   $file: $(($SIZE / 1024))KB"
          done
          
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Generate Build Report
        run: |
          echo "📊 Build Report:" > build-report.txt
          echo "Files built:" >> build-report.txt
          ls -lh *.html *.css *.js *.json 2>/dev/null >> build-report.txt

  # STAGE 3: CREATE BACKUP
  backup:
    name: 💾 Create Backup
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.build_status == 'success'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create Backup Branch
        run: |
          BACKUP_BRANCH="backup-$(date +%Y%m%d-%H%M%S)"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -b $BACKUP_BRANCH
          git push origin $BACKUP_BRANCH
          echo "✅ Backup created: $BACKUP_BRANCH"

  # STAGE 4: UPDATE CACHE VERSION
  update-cache:
    name: 🔄 Update Cache Version
    runs-on: ubuntu-latest
    needs: [validate, build, backup]
    if: needs.build.outputs.build_status == 'success'
    outputs:
      old_version: ${{ steps.version.outputs.old_version }}
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Current Version
        id: version
        run: |
          OLD_VERSION=$(grep -oP 'const CACHE_NAME = "\K[^"]+' sw.js)
          echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "Current cache version: $OLD_VERSION"

      - name: Generate New Version
        id: new_version
        run: |
          NEW_VERSION="unitedtrips-$(date +%Y-%m-%d-%s)"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New cache version: $NEW_VERSION"

      - name: Update sw.js
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          
          # Backup original
          cp sw.js sw.js.bak
          
          # Update version
          sed -i "s/const CACHE_NAME = \"[^\"]*\";/const CACHE_NAME = \"${NEW_VERSION}\";/" sw.js
          
          # Verify update
          if grep -q "$NEW_VERSION" sw.js; then
            echo "✅ Cache version updated successfully"
            echo "Old: ${{ steps.version.outputs.old_version }}"
            echo "New: $NEW_VERSION"
          else
            echo "❌ Failed to update cache version"
            cp sw.js.bak sw.js
            exit 1
          fi

      - name: Verify sw.js Syntax
        run: |
          if grep -q "<<\|>>" sw.js; then
            echo "❌ Syntax error in updated sw.js"
            exit 1
          fi
          echo "✅ Updated sw.js has valid syntax"

      - name: Commit Cache Update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sw.js
          git diff --cached --quiet || (
            git commit -m "chore: cache version ${{ steps.version.outputs.old_version }} → ${{ steps.new_version.outputs.new_version }}"
            git push origin main
            echo "✅ Cache update committed"
          )

  # STAGE 5: ROLLBACK ON FAILURE
  rollback:
    name: ⚠️ Rollback on Failure
    runs-on: ubuntu-latest
    needs: update-cache
    if: failure()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Rollback sw.js
        run: |
          echo "🔄 Rolling back changes..."
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git revert HEAD --no-edit
          git push origin main
          echo "⚠️  Rollback completed"

  # STAGE 6: FINAL REPORT
  report:
    name: 📋 Generate Report
    runs-on: ubuntu-latest
    needs: [validate, build, update-cache]
    if: always()
    steps:
      - name: Success Report
        if: needs.update-cache.result == 'success'
        run: |
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo ""
          echo "Cache Version Updates:"
          echo "  Old: ${{ needs.update-cache.outputs.old_version }}"
          echo "  New: ${{ needs.update-cache.outputs.new_version }}"
          echo ""
          echo "✅ All validations passed"
          echo "✅ Files built successfully"
          echo "✅ Cache version updated"
          echo ""
          echo "Next Steps:"
          echo "1. Pull latest changes: git pull"
          echo "2. Deploy to FTP with updated sw.js"
          echo "3. Users will receive the latest version"

      - name: Failure Report
        if: needs.update-cache.result == 'failure'
        run: |
          echo "❌ DEPLOYMENT FAILED"
          echo ""
          echo "⚠️  Changes have been rolled back"
          echo "Please fix the errors and try again"
          exit 1

  # STAGE 7: NOTIFY DEVELOPER
  notify:
    name: 🔔 Notify Developer
    runs-on: ubuntu-latest
    needs: [update-cache, report]
    if: always()
    steps:
      - name: Create Summary
        run: |
          if [ "${{ needs.update-cache.result }}" = "success" ]; then
            echo "✅ Deployment completed successfully"
            echo "New cache version: ${{ needs.update-cache.outputs.new_version }}"
          else
            echo "❌ Deployment failed - changes rolled back"
          fi
