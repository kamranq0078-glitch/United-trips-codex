name: Auto-Update Cache Version

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update cache version in sw.js
        run: |
          TIMESTAMP=$(date +%s)
          DATE=$(date +%Y-%m-%d)
          sed -i "s/const CACHE_NAME = \"unitedtrips-v[0-9]*\";/const CACHE_NAME = \"unitedtrips-${DATE}-${TIMESTAMP}\";/g" sw.js
          cat sw.js | head -5

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sw.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update cache version" && git push)
